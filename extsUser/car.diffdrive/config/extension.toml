# Extension configuration file.
# Visit the "Extension configuration file (extension.toml)" section for more details:
# https://docs.omniverse.nvidia.com/kit/docs/kit-manual/latest/guide/extensions_advanced.html
#

[core]
reloadable = true
order = 0

[package]
version = "0.1.0"
category = "internal"
title = "Car DiffDrive"
description = "Custom OmniGraph node for converting ROS2 cmd_vel to differential-drive wheel velocities."
authors = ["Devin Tseng <alianlbj23@gmail.com>"]
keywords = ["isaac","ros2","diffdrive","cmd_vel","wheel"]
changelog = "docs/CHANGELOG.md"
readme = "docs/README.md"
preview_image = "data/preview.png"
icon = "data/icon.png"

[dependencies]
"omni.graph" = {}
"omni.graph.tools" = {}

[settings]
exts."car.diffdrive".timeout = 5

